[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "amipro-sam-toolkit"
version = "0.1.0"
description = "Preservation-oriented parser and converter for Lotus Ami Pro 3.x SAM documents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Ami Pro SAM Toolkit contributors" }]
keywords = ["ami-pro", "digital-preservation", "document-conversion", "sam"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup",
]
dependencies = ["reportlab>=4.0,<6"]

[project.optional-dependencies]
docx = ["python-docx>=1.1,<2"]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
amipro-sam = "amipro_sam.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
